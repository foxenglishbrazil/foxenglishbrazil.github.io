name: Deploy Fox English Brazil no GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar pacotes e gerar build do Angular
        run: |
          npm ci || npm install
          npx ng build --base-href /
          cp dist/foxenglishbrazil/browser/index.html dist/foxenglishbrazil/browser/404.html

      - name: Preparar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/foxenglishbrazil/browser

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
